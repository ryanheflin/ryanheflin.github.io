<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Coach's Notes | CE Altafulla U15</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/site.js" defer></script>


  <!-- =========================================================
       BLOG POST STORAGE
  ========================================================== -->

  <script>
    window.blogPosts = [];
  </script>


  <!-- =========================================================
       BLOG POST FILES

       Add each new post here.
  ========================================================== -->

  <script src="posts/welcome-letter.js"></script>
  <script src="posts/differences.js"></script>
  <script src="posts/3-ways.js"></script>


  <style>
    :root {
      --altafulla-yellow: #f2e40a;
      --altafulla-black: #000000;
      --altafulla-blue: #62bed6;
    }

    html {
      scroll-behavior: smooth;
    }
  </style>
</head>


<body class="bg-gray-900 text-white antialiased flex min-h-screen pb-16">


  <!-- =========================================================
       SHARED SIDEBAR
  ========================================================== -->

  <div id="site-sidebar"></div>



  <!-- =========================================================
       MAIN CONTENT
  ========================================================== -->

  <main
    class="flex-grow p-4 pt-20 md:p-10 md:ml-64 max-w-5xl mx-auto w-full space-y-8"
  >


    <!-- =======================================================
         PAGE HEADER
    ======================================================== -->

    <header>

      <h2
        class="text-3xl font-extrabold mb-1"
        style="color: var(--altafulla-yellow);"
      >
        Blog & Coach's Notes
      </h2>


      <p class="text-gray-400 text-sm">
        Post-match reflections, tactical video analysis,
        weekly reviews, and questions from families.
      </p>

    </header>



    <!-- =======================================================
         CATEGORY FILTERS
    ======================================================== -->

    <div
      class="flex space-x-2 border-b border-gray-700 pb-3 overflow-x-auto"
    >

      <button
        onclick="filterPosts('all')"
        id="filter-all"
        class="filter-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-gray-700 text-white whitespace-nowrap"
        style="color: var(--altafulla-yellow);"
      >
        All Posts
      </button>


      <button
        onclick="filterPosts('match-report')"
        id="filter-match-report"
        class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-400 hover:text-white bg-gray-800 whitespace-nowrap"
      >
        ⚽ Match Reports
      </button>


      <button
        onclick="filterPosts('video-analysis')"
        id="filter-video-analysis"
        class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-400 hover:text-white bg-gray-800 whitespace-nowrap"
      >
        🎥 Videos
      </button>


      <button
        onclick="filterPosts('for-players')"
        id="filter-for-players"
        class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-400 hover:text-white bg-gray-800 whitespace-nowrap"
      >
        📋 For Players
      </button>


      <button
        onclick="filterPosts('qa')"
        id="filter-qa"
        class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-gray-400 hover:text-white bg-gray-800 whitespace-nowrap"
      >
        💬 Questions & Notes
      </button>

    </div>



    <!-- =======================================================
         FEATURED / SELECTED POST
    ======================================================== -->

    <section id="featured-post-container">

      <!-- Selected post is inserted here automatically -->

    </section>



    <!-- =======================================================
         POST LIST
    ======================================================== -->

    <section class="space-y-4 pt-2">

      <div
        class="flex items-center justify-between gap-4 border-b border-gray-800 pb-2"
      >

        <h3
          id="post-list-heading"
          class="text-xl font-bold text-gray-200"
        >
          More Posts
        </h3>


        <span
          id="post-count"
          class="text-xs text-gray-500"
        >
        </span>

      </div>


      <div
        id="post-list"
        class="divide-y divide-gray-800 border-t border-b border-gray-800"
      >

        <!-- Post titles are inserted here automatically -->

      </div>

    </section>


  </main>



  <!-- =========================================================
       FOOTER
  ========================================================== -->

  <footer
    class="fixed bottom-0 left-0 md:left-64 right-0 text-center text-gray-400 text-xs py-3 bg-gray-950 border-t border-gray-800 z-10"
  >
    &copy; 2026 Ex Profundo by Ryan Heflin — CE Altafulla S15
  </footer>



  <!-- =========================================================
       BLOG JAVASCRIPT
  ========================================================== -->

  <script>


    /* ==========================================================
       BLOG STATE
    ========================================================== */

    let activeCategory = 'all';

    let selectedPostId = null;



    /* ==========================================================
       CATEGORY LABELS
    ========================================================== */

    const categoryLabels = {

      'match-report': 'Match Report',

      'video-analysis': 'Video Analysis',

      'for-players': 'For Players',

      'qa': 'Questions & Notes'

    };



    /* ==========================================================
       DATE HELPERS
    ========================================================== */

    function formatPostDate(dateString) {

      const date =
        new Date(
          `${dateString}T12:00:00`
        );


      return date.toLocaleDateString(
        'en-US',
        {
          month: 'long',
          day: 'numeric',
          year: 'numeric'
        }
      );

    }



    /* ==========================================================
       SORT POSTS

       Welcome letter always stays pinned first.
       All other posts are sorted newest to oldest.
    ========================================================== */

    function getSortedPosts() {

      return [
        ...(window.blogPosts || [])
      ].sort(
        (a, b) => {

          if (a.id === 'welcome-letter') {
            return -1;
          }

          if (b.id === 'welcome-letter') {
            return 1;
          }

          return (
            new Date(b.date) -
            new Date(a.date)
          );

        }
      );

    }



    /* ==========================================================
       FILTERED POSTS
    ========================================================== */

    function getFilteredPosts() {

      const posts =
        getSortedPosts();


      if (
        activeCategory === 'all'
      ) {

        return posts;

      }


      return posts.filter(
        post =>
          post.category ===
          activeCategory
      );

    }



    /* ==========================================================
       UPDATE URL

       Gives every post a shareable direct link such as:

       ?post=differences
       ?post=3-ways
    ========================================================== */

    function updatePostUrl(postId) {

      const url =
        new URL(window.location.href);


      if (
        postId &&
        postId !== 'welcome-letter'
      ) {

        url.searchParams.set(
          'post',
          postId
        );

      } else {

        url.searchParams.delete(
          'post'
        );

      }


      window.history.pushState(
        {},
        '',
        url
      );

    }



    /* ==========================================================
       FILTER BUTTON APPEARANCE
    ========================================================== */

    function updateFilterButtons(category) {

      document
        .querySelectorAll(
          '.filter-btn'
        )
        .forEach(btn => {

          btn.classList.remove(
            'bg-gray-700',
            'text-white'
          );


          btn.classList.add(
            'bg-gray-800',
            'text-gray-400'
          );


          btn.style.color = '';

        });



      const activeButton =
        document.getElementById(
          `filter-${category}`
        );



      if (activeButton) {

        activeButton.classList.add(
          'bg-gray-700',
          'text-white'
        );


        activeButton.classList.remove(
          'bg-gray-800',
          'text-gray-400'
        );


        activeButton.style.color =
          'var(--altafulla-yellow)';

      }

    }



    /* ==========================================================
       FEATURED POST
    ========================================================== */

    function renderFeaturedPost() {

      const container =
        document.getElementById(
          'featured-post-container'
        );


      const posts =
        getFilteredPosts();



      if (
        posts.length === 0
      ) {

        container.innerHTML = `

          <div
            class="bg-gray-800 p-6 rounded-xl border border-gray-700"
          >

            <p
              class="text-sm text-gray-400"
            >
              No posts have been published in this category yet.
            </p>

          </div>

        `;


        selectedPostId = null;

        return;

      }



      let selectedPost =
        posts.find(
          post =>
            post.id ===
            selectedPostId
        );



      if (!selectedPost) {

        selectedPost =
          posts[0];


        selectedPostId =
          selectedPost.id;

      }



      const isPinned =
        selectedPost.id ===
        'welcome-letter';



      container.innerHTML = `

        <article
          class="bg-gray-800 p-5 md:p-6 rounded-xl border border-gray-700 shadow-lg space-y-6"
        >


          <!-- Post Meta -->
          <div
            class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3"
          >


            <span
              class="self-start text-xs font-bold px-2.5 py-1 rounded-full bg-gray-700 text-green-400 border border-gray-600 uppercase"
            >
              ${
                isPinned
                  ? 'Pinned • '
                  : ''
              }

              ${
                selectedPost.categoryLabel ||
                categoryLabels[selectedPost.category] ||
                'Coach’s Notes'
              }
            </span>



            <span
              class="text-xs text-gray-400"
            >
              ${formatPostDate(selectedPost.date)}
            </span>


          </div>



          <!-- Post Header -->
          <div>


            <h3
              class="text-2xl md:text-3xl font-bold text-white"
            >
              ${selectedPost.title}
            </h3>


            ${
              selectedPost.excerpt
                ? `

                  <p
                    class="text-gray-400 text-sm mt-2"
                  >
                    ${selectedPost.excerpt}
                  </p>

                `
                : ''
            }


          </div>



          <!-- Post Content -->
          <div
            class="space-y-5 text-gray-300 text-sm leading-relaxed"
          >
            ${selectedPost.content}
          </div>



          <!-- Post Footer -->
          <div
            class="pt-4 border-t border-gray-700 flex flex-col sm:flex-row sm:justify-between gap-2 text-xs text-gray-400"
          >

            <span>
              By ${
                selectedPost.author ||
                'Coach Ryan Heflin'
              }
            </span>


            <span
              class="font-bold text-green-400"
            >
              ${
                selectedPost.categoryLabel ||
                categoryLabels[selectedPost.category] ||
                'Coach’s Notes'
              }
            </span>

          </div>


        </article>

      `;

    }



    /* ==========================================================
       POST LIST
    ========================================================== */

    function renderPostList() {

      const container =
        document.getElementById(
          'post-list'
        );


      const count =
        document.getElementById(
          'post-count'
        );


      const posts =
        getFilteredPosts();



      count.textContent =
        `${posts.length} ${
          posts.length === 1
            ? 'post'
            : 'posts'
        }`;



      const otherPosts =
        posts.filter(
          post =>
            post.id !==
            selectedPostId
        );



      if (
        otherPosts.length === 0
      ) {

        container.innerHTML = `

          <div
            class="py-5 text-sm text-gray-500"
          >
            No additional posts yet.
          </div>

        `;

        return;

      }



      container.innerHTML =
        otherPosts
          .map(
            post => `

              <button
                type="button"
                onclick="selectPost('${post.id}')"
                class="w-full text-left py-4 px-1 hover:px-3 hover:bg-gray-800/60 transition-all"
              >


                <div
                  class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2"
                >


                  <div>


                    <div
                      class="flex flex-wrap items-center gap-2"
                    >


                      <span
                        class="text-xs font-bold uppercase"
                        style="color: var(--altafulla-blue);"
                      >
                        ${
                          post.categoryLabel ||
                          categoryLabels[post.category] ||
                          'Coach’s Notes'
                        }
                      </span>


                    </div>



                    <h4
                      class="text-base font-bold text-white mt-1"
                    >
                      ${post.title}
                    </h4>



                    ${
                      post.excerpt
                        ? `

                          <p
                            class="text-sm text-gray-400 mt-1"
                          >
                            ${post.excerpt}
                          </p>

                        `
                        : ''
                    }


                  </div>



                  <span
                    class="text-xs text-gray-500 whitespace-nowrap"
                  >
                    ${formatPostDate(post.date)}
                  </span>


                </div>


              </button>

            `
          )
          .join('');

    }



    /* ==========================================================
       SELECT POST

       Clicking a post also updates the URL so the link
       can be copied and shared directly.
    ========================================================== */

    function selectPost(postId) {

      selectedPostId =
        postId;


      updatePostUrl(
        postId
      );


      renderFeaturedPost();


      renderPostList();


      document
        .getElementById(
          'featured-post-container'
        )
        .scrollIntoView({

          behavior: 'smooth',

          block: 'start'

        });

    }



    /* ==========================================================
       CATEGORY FILTER
    ========================================================== */

    function filterPosts(category) {

      activeCategory =
        category;


      selectedPostId =
        null;


      updateFilterButtons(
        category
      );


      /*
        When changing category, remove any direct post URL.
        The first post in that category will then be shown.
      */

      const url =
        new URL(window.location.href);


      url.searchParams.delete(
        'post'
      );


      window.history.pushState(
        {},
        '',
        url
      );


      renderFeaturedPost();

      renderPostList();

    }



    /* ==========================================================
       BROWSER BACK / FORWARD

       If the visitor uses the browser back or forward button,
       reopen the appropriate post.
    ========================================================== */

    window.addEventListener(
      'popstate',
      function() {

        const params =
          new URLSearchParams(
            window.location.search
          );


        const requestedPostId =
          params.get(
            'post'
          );


        const requestedPost =
          (window.blogPosts || [])
            .find(
              post =>
                post.id ===
                requestedPostId
            );


        activeCategory =
          'all';


        updateFilterButtons(
          'all'
        );


        if (requestedPost) {

          selectedPostId =
            requestedPost.id;

        } else {

          selectedPostId =
            null;

        }


        renderFeaturedPost();

        renderPostList();

      }
    );



    /* ==========================================================
       INITIALIZE BLOG

       If the URL includes a post ID, open that post.

       Example:
       index.html?post=differences
       index.html?post=3-ways

       Otherwise the pinned welcome letter opens normally.
    ========================================================== */

    document.addEventListener(
      'DOMContentLoaded',
      function() {

        const params =
          new URLSearchParams(
            window.location.search
          );


        const requestedPostId =
          params.get(
            'post'
          );


        const requestedPost =
          (window.blogPosts || [])
            .find(
              post =>
                post.id ===
                requestedPostId
            );


        activeCategory =
          'all';


        updateFilterButtons(
          'all'
        );


        if (requestedPost) {

          selectedPostId =
            requestedPost.id;

        } else {

          selectedPostId =
            null;

        }


        renderFeaturedPost();

        renderPostList();

      }
    );


  </script>


</body>

</html>
