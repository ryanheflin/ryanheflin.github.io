<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Coach's Notes | CE Altafulla U15</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/site.js" defer></script>


  <!-- =========================================================
       BLOG POST STORAGE
  ========================================================== -->

  <script>
    window.blogPosts = [];
  </script>


  <!-- =========================================================
       BLOG POST FILES

       Add each new post here.
  ========================================================== -->

  <script src="posts/welcome-letter.js"></script>
  <script src="posts/differences.js"></script>
  <script src="posts/3-ways.js"></script>
  <script src="posts/better-this-week.js"></script>
  <script src="posts/first-video-comparison-pallaresos.js"></script>


  <style>

    :root {
      --altafulla-yellow: #f2e40a;
      --altafulla-black: #000000;
      --altafulla-blue: #62bed6;
    }

    html {
      scroll-behavior: smooth;
    }

  </style>

</head>


<body
  class="bg-gray-900 text-white antialiased flex min-h-screen pb-16"
>


  <!-- =========================================================
       SHARED SIDEBAR
  ========================================================== -->

  <div id="site-sidebar"></div>



  <!-- =========================================================
       MAIN CONTENT
  ========================================================== -->

  <main
    class="flex-grow p-4 pt-20 md:p-10 md:ml-64 max-w-7xl mx-auto w-full"
  >


    <!-- =======================================================
         PAGE HEADER
    ======================================================== -->

    <header class="mb-7">

      <h2
        class="text-3xl font-extrabold mb-1"
        style="color: var(--altafulla-yellow);"
      >
        Blog & Coach's Notes
      </h2>


      <p class="text-gray-400 text-sm max-w-2xl">
        Post-match reflections, tactical video analysis,
        weekly reviews, and questions from families.
      </p>

    </header>



    <!-- =======================================================
         MOBILE POST NAVIGATION
    ======================================================== -->

    <div class="lg:hidden mb-6">

      <label
        for="mobile-post-select"
        class="block text-xs uppercase tracking-wide font-bold text-gray-500 mb-2"
      >
        Choose a Post
      </label>


      <select
        id="mobile-post-select"
        onchange="selectPost(this.value)"
        class="w-full bg-gray-800 border border-gray-700 text-white text-sm rounded-lg px-4 py-3 focus:outline-none focus:border-gray-500"
      >
      </select>

    </div>



    <!-- =======================================================
         BLOG LAYOUT
    ======================================================== -->

    <div
      class="grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_300px] gap-8 items-start"
    >


      <!-- =====================================================
           SELECTED POST
      ====================================================== -->

      <section
        id="featured-post-container"
        class="min-w-0"
      >

        <!-- Selected post inserted automatically -->

      </section>



      <!-- =====================================================
           DESKTOP POST ARCHIVE
      ====================================================== -->

      <aside
        class="hidden lg:block"
      >

        <div
          class="sticky top-8 bg-gray-800 rounded-xl border border-gray-700 overflow-hidden shadow-lg"
        >


          <!-- Archive Header -->
          <div
            class="px-5 py-4 bg-gray-950 border-b border-gray-700"
          >

            <h3
              class="font-bold text-white text-lg"
            >
              Posts
            </h3>

            <p
              class="text-xs text-gray-500 mt-1"
            >
              Newest first
            </p>

          </div>



          <!-- Start Here -->
          <div
            id="start-here-nav"
            class="border-b border-gray-700"
          >
          </div>



          <!-- Recent Posts -->
          <div
            id="desktop-post-nav"
          >
          </div>


        </div>

      </aside>


    </div>


  </main>



  <!-- =========================================================
       FOOTER
  ========================================================== -->

  <footer
    class="fixed bottom-0 left-0 md:left-64 right-0 text-center text-gray-400 text-xs py-3 bg-gray-950 border-t border-gray-800 z-10"
  >
    &copy; 2026 Ex Profundo by Ryan Heflin — CE Altafulla S15
  </footer>



  <!-- =========================================================
       BLOG JAVASCRIPT
  ========================================================== -->

  <script>


    /* ==========================================================
       BLOG STATE
    ========================================================== */

    let selectedPostId = null;



    /* ==========================================================
       CATEGORY LABELS
    ========================================================== */

    const categoryLabels = {

      'match-report': 'Match Report',

      'video-analysis': 'Video Analysis',

      'for-players': 'For Players',

      'qa': 'Questions & Notes'

    };



    /* ==========================================================
       DATE HELPERS
    ========================================================== */

    function formatPostDate(dateString) {

      const date =
        new Date(
          `${dateString}T12:00:00`
        );


      return date.toLocaleDateString(
        'en-US',
        {
          month: 'short',
          day: 'numeric',
          year: 'numeric'
        }
      );

    }



    function formatFullPostDate(dateString) {

      const date =
        new Date(
          `${dateString}T12:00:00`
        );


      return date.toLocaleDateString(
        'en-US',
        {
          month: 'long',
          day: 'numeric',
          year: 'numeric'
        }
      );

    }



    /* ==========================================================
       SORT POSTS

       Welcome Letter is handled separately.

       All normal posts:
       newest → oldest
    ========================================================== */

    function getSortedPosts() {

      return [
        ...(window.blogPosts || [])
      ]
        .filter(
          post =>
            post.id !== 'welcome-letter'
        )
        .sort(
          (a, b) =>
            new Date(b.date) -
            new Date(a.date)
        );

    }



    function getWelcomePost() {

      return (
        window.blogPosts || []
      ).find(
        post =>
          post.id === 'welcome-letter'
      );

    }



    /* ==========================================================
       UPDATE URL

       Examples:

       ?post=differences
       ?post=3-ways
       ?post=better-this-week
    ========================================================== */

    function updatePostUrl(postId) {

      const url =
        new URL(
          window.location.href
        );


      if (postId) {

        url.searchParams.set(
          'post',
          postId
        );

      } else {

        url.searchParams.delete(
          'post'
        );

      }


      window.history.pushState(
        {},
        '',
        url
      );

    }



    /* ==========================================================
       FEATURED POST
    ========================================================== */

    function renderFeaturedPost() {

      const container =
        document.getElementById(
          'featured-post-container'
        );


      const allPosts =
        window.blogPosts || [];


      let selectedPost =
        allPosts.find(
          post =>
            post.id ===
            selectedPostId
        );



      /*
        If no valid post is selected,
        open the newest normal blog post.
      */

      if (!selectedPost) {

        const sortedPosts =
          getSortedPosts();


        selectedPost =
          sortedPosts[0] ||
          getWelcomePost();


        if (selectedPost) {

          selectedPostId =
            selectedPost.id;

        }

      }



      if (!selectedPost) {

        container.innerHTML = `

          <div
            class="bg-gray-800 p-6 rounded-xl border border-gray-700"
          >

            <p
              class="text-sm text-gray-400"
            >
              No posts have been published yet.
            </p>

          </div>

        `;

        return;

      }



      const isWelcome =
        selectedPost.id ===
        'welcome-letter';



      container.innerHTML = `

        <article
          class="bg-gray-800 p-5 md:p-7 rounded-xl border border-gray-700 shadow-lg space-y-6"
        >


          <!-- Post Meta -->
          <div
            class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3"
          >


            <span
              class="self-start text-xs font-bold px-2.5 py-1 rounded-full bg-gray-700 border border-gray-600 uppercase"
              style="color: ${
                isWelcome
                  ? 'var(--altafulla-yellow)'
                  : 'var(--altafulla-blue)'
              };"
            >

              ${
                isWelcome
                  ? 'Start Here • '
                  : ''
              }

              ${
                selectedPost.categoryLabel ||
                categoryLabels[selectedPost.category] ||
                'Coach’s Notes'
              }

            </span>



            <span
              class="text-xs text-gray-400"
            >
              ${formatFullPostDate(selectedPost.date)}
            </span>


          </div>



          <!-- Post Header -->
          <div>


            <h3
              class="text-2xl md:text-3xl font-bold text-white leading-tight"
            >
              ${selectedPost.title}
            </h3>


            ${
              selectedPost.excerpt
                ? `

                  <p
                    class="text-gray-400 text-sm mt-3 leading-relaxed"
                  >
                    ${selectedPost.excerpt}
                  </p>

                `
                : ''
            }


          </div>



          <!-- Post Content -->
          <div
            class="space-y-5 text-gray-300 text-sm leading-relaxed"
          >
            ${selectedPost.content}
          </div>



          <!-- Post Footer -->
          <div
            class="pt-4 border-t border-gray-700 flex flex-col sm:flex-row sm:justify-between gap-2 text-xs text-gray-400"
          >

            <span>
              By ${
                selectedPost.author ||
                'Coach Ryan Heflin'
              }
            </span>


            <span
              class="font-bold"
              style="color: var(--altafulla-blue);"
            >
              ${
                selectedPost.categoryLabel ||
                categoryLabels[selectedPost.category] ||
                'Coach’s Notes'
              }
            </span>

          </div>


        </article>

      `;

    }



    /* ==========================================================
       WELCOME / START HERE NAVIGATION
    ========================================================== */

    function renderStartHereNav() {

      const container =
        document.getElementById(
          'start-here-nav'
        );


      const welcome =
        getWelcomePost();


      if (!welcome) {

        container.innerHTML = '';

        return;

      }



      const isSelected =
        welcome.id ===
        selectedPostId;



      container.innerHTML = `

        <button
          type="button"
          onclick="selectPost('${welcome.id}')"
          class="
            w-full text-left px-5 py-4 transition-colors
            ${
              isSelected
                ? 'bg-gray-700'
                : 'hover:bg-gray-700/60'
            }
          "
        >

          <span
            class="text-[10px] uppercase tracking-wider font-bold"
            style="color: var(--altafulla-yellow);"
          >
            Start Here
          </span>


          <h4
            class="
              text-sm font-bold mt-1 leading-snug
              ${
                isSelected
                  ? 'text-white'
                  : 'text-gray-200'
              }
            "
          >
            ${welcome.title}
          </h4>

        </button>

      `;

    }



    /* ==========================================================
       DESKTOP POST NAVIGATION
    ========================================================== */

    function renderDesktopPostNav() {

      const container =
        document.getElementById(
          'desktop-post-nav'
        );


      const posts =
        getSortedPosts();



      if (
        posts.length === 0
      ) {

        container.innerHTML = `

          <div
            class="px-5 py-5 text-sm text-gray-500"
          >
            No posts yet.
          </div>

        `;

        return;

      }



      container.innerHTML =
        posts
          .map(
            post => {

              const isSelected =
                post.id ===
                selectedPostId;


              return `

                <button
                  type="button"
                  onclick="selectPost('${post.id}')"
                  class="
                    group
                    w-full
                    text-left
                    px-5
                    py-4
                    border-b
                    border-gray-700
                    last:border-b-0
                    transition-colors
                    ${
                      isSelected
                        ? 'bg-gray-700'
                        : 'hover:bg-gray-700/60'
                    }
                  "
                >


                  <div
                    class="flex items-start gap-3"
                  >


                    <!-- Active Indicator -->
                    <div
                      class="
                        mt-1
                        w-1
                        self-stretch
                        min-h-[44px]
                        rounded-full
                      "
                      style="
                        background-color:
                        ${
                          isSelected
                            ? 'var(--altafulla-yellow)'
                            : 'transparent'
                        };
                      "
                    >
                    </div>



                    <div
                      class="min-w-0 flex-1"
                    >


                      <!-- Date -->
                      <p
                        class="
                          text-[11px]
                          font-semibold
                          ${
                            isSelected
                              ? 'text-gray-300'
                              : 'text-gray-500'
                          }
                        "
                      >
                        ${formatPostDate(post.date)}
                      </p>



                      <!-- Title -->
                      <h4
                        class="
                          text-sm
                          font-bold
                          mt-1
                          leading-snug
                          transition-colors
                          ${
                            isSelected
                              ? 'text-white'
                              : 'text-gray-200 group-hover:text-white'
                          }
                        "
                      >
                        ${post.title}
                      </h4>



                      <!-- Category -->
                      <p
                        class="text-[10px] uppercase tracking-wide font-bold mt-2"
                        style="color: var(--altafulla-blue);"
                      >
                        ${
                          post.categoryLabel ||
                          categoryLabels[post.category] ||
                          'Coach’s Notes'
                        }
                      </p>


                    </div>


                  </div>


                </button>

              `;

            }
          )
          .join('');

    }



    /* ==========================================================
       MOBILE POST SELECT
    ========================================================== */

    function renderMobilePostSelect() {

      const select =
        document.getElementById(
          'mobile-post-select'
        );


      const welcome =
        getWelcomePost();


      const posts =
        getSortedPosts();


      let options = '';



      if (welcome) {

        options += `

          <option
            value="${welcome.id}"
            ${
              welcome.id === selectedPostId
                ? 'selected'
                : ''
            }
          >
            Start Here — ${welcome.title}
          </option>

        `;

      }



      posts.forEach(
        post => {

          options += `

            <option
              value="${post.id}"
              ${
                post.id === selectedPostId
                  ? 'selected'
                  : ''
              }
            >
              ${formatPostDate(post.date)} — ${post.title}
            </option>

          `;

        }
      );


      select.innerHTML =
        options;

    }



    /* ==========================================================
       RENDER ALL NAVIGATION
    ========================================================== */

    function renderNavigation() {

      renderStartHereNav();

      renderDesktopPostNav();

      renderMobilePostSelect();

    }



    /* ==========================================================
       SELECT POST
    ========================================================== */

    function selectPost(postId) {

      if (!postId) {
        return;
      }


      selectedPostId =
        postId;


      updatePostUrl(
        postId
      );


      renderFeaturedPost();

      renderNavigation();



      document
        .getElementById(
          'featured-post-container'
        )
        .scrollIntoView({

          behavior: 'smooth',

          block: 'start'

        });

    }



    /* ==========================================================
       BROWSER BACK / FORWARD
    ========================================================== */

    window.addEventListener(
      'popstate',
      function() {

        const params =
          new URLSearchParams(
            window.location.search
          );


        const requestedPostId =
          params.get(
            'post'
          );


        const requestedPost =
          (window.blogPosts || [])
            .find(
              post =>
                post.id ===
                requestedPostId
            );


        if (requestedPost) {

          selectedPostId =
            requestedPost.id;

        } else {

          const posts =
            getSortedPosts();


          selectedPostId =
            posts[0]?.id ||
            getWelcomePost()?.id ||
            null;

        }


        renderFeaturedPost();

        renderNavigation();

      }
    );



    /* ==========================================================
       INITIALIZE BLOG

       Direct URLs still work:

       ?post=differences
       ?post=3-ways
       ?post=better-this-week

       Without a direct URL, the newest post opens.
    ========================================================== */

    document.addEventListener(
      'DOMContentLoaded',
      function() {

        const params =
          new URLSearchParams(
            window.location.search
          );


        const requestedPostId =
          params.get(
            'post'
          );


        const requestedPost =
          (window.blogPosts || [])
            .find(
              post =>
                post.id ===
                requestedPostId
            );



        if (requestedPost) {

          selectedPostId =
            requestedPost.id;

        } else {

          const posts =
            getSortedPosts();


          selectedPostId =
            posts[0]?.id ||
            getWelcomePost()?.id ||
            null;

        }


        renderFeaturedPost();

        renderNavigation();

      }
    );


  </script>

</body>

</html>
